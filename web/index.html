<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>자세 자동 라벨</title><link rel="icon" href="data:,">
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1d2330;--mute:#6b7280;--line:#e3e6eb;--acc:#2563eb;--warn:#d97706;--bad:#dc2626;--ok:#16a34a}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 system-ui,"Malgun Gothic",sans-serif;background:var(--bg);color:var(--ink)}
header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);padding:8px 16px}
header .hrow{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
header h1{font-size:16px;margin:0}#curw{font-size:14px}
nav{display:flex;gap:4px;flex-wrap:wrap}nav button{border:0;background:none;padding:8px 12px;border-radius:8px;cursor:pointer;font:inherit;color:var(--mute)}
nav button.on{background:#e8efff;color:var(--acc);font-weight:600}nav button:disabled{opacity:.4;cursor:default}
.cnt{font-size:12px;color:var(--mute);margin-left:5px;font-weight:400}
#jobmini{margin:0 0 0 auto;font-size:13px;color:var(--mute)}#jobmini.go{cursor:pointer;color:var(--acc);text-decoration:underline dotted}
main{padding:16px;max-width:1500px;margin:0 auto}.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
select,input[type=number],input[type=text]{font:inherit;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:#fff}
.btn{font:inherit;padding:7px 14px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.danger-o{background:#fff;border-color:var(--bad);color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}.btn.sm{padding:3px 9px;font-size:12px}
.lnk{background:none;border:0;padding:0;font:inherit;color:var(--acc);text-decoration:underline;cursor:pointer}
.panel{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
.panel h2{font-size:15px;margin:0 0 8px}h3.sec{font-size:14px;margin:18px 0 4px;padding-top:12px;border-top:1px solid var(--line)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:900px){.two{grid-template-columns:1fr}}
.sub{border:1px solid var(--line);border-radius:10px;padding:12px}.sub h3{font-size:14px;margin:0 0 4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer}
.card.need{border-color:var(--warn);box-shadow:0 0 0 1px var(--warn)}.card.done{border-color:var(--ok)}
.card.sel{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc)}
.card .cap{padding:6px 8px;font-size:12px;color:var(--mute)}.card .cap .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pic{position:relative;line-height:0;background:#ddd}.pic img{width:100%;height:auto;display:block}
.pic svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.card.sel .pic::after{content:'';position:absolute;inset:0;background:rgba(37,99,235,.18);pointer-events:none}
.chk{position:absolute;top:6px;left:6px;z-index:2;width:22px;height:22px;border-radius:5px;background:rgba(255,255,255,.8);border:1.5px solid #6b7280;line-height:19px;text-align:center;font-size:14px;font-weight:700;color:transparent;user-select:none}
.chk:hover{border-color:var(--acc)}.card.sel .chk{background:var(--acc);border-color:var(--acc);color:#fff}
.tag{display:inline-block;padding:1px 7px;border-radius:99px;font-size:11px;font-weight:600;margin-right:4px;line-height:18px}
.stat{background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px 12px}
.note{color:var(--mute);font-size:13px;margin:6px 0 10px}
.err{color:var(--bad);font-size:13px;min-height:18px;margin:6px 0 0}
.warnl{color:var(--warn);font-size:13px;margin:4px 0 0 22px}
.seg{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px}
.seg button{border:1px solid var(--line);background:#fff;padding:6px 12px;border-radius:8px;cursor:pointer;font:inherit;color:var(--ink)}
.seg button.on{background:#e8efff;color:var(--acc);border-color:#c7d7fe;font-weight:600}.seg button.zero{color:var(--mute)}.seg button.zero .sc{color:var(--mute)!important}
.seg .sc{margin-left:4px;font-weight:600}
.selbar{position:sticky;top:var(--hh,92px);z-index:4;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-bottom:10px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;box-shadow:0 2px 6px rgba(0,0,0,.05)}
.selbar .sep{width:1px;height:22px;background:var(--line);margin:0 6px}
.lock{background:#fff7ed;border:1px solid #fdba74;color:#9a3412;border-radius:8px;padding:8px 12px;margin-bottom:10px}
table{border-collapse:collapse;background:#fff}td,th{padding:7px 12px;border-bottom:1px solid var(--line);text-align:left}
.drop{border:2px dashed var(--line);border-radius:10px;padding:22px;text-align:center;color:var(--mute);margin:6px 0}.drop.hot{border-color:var(--acc);background:#eef4ff;color:var(--acc)}
progress{width:320px;max-width:60vw;vertical-align:middle}
details{margin-top:14px}summary{cursor:pointer;color:var(--mute)}pre.tree{background:var(--bg);border-radius:8px;padding:10px;font-size:13px;margin:8px 0 0}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1d2330;color:#fff;padding:10px 18px;border-radius:8px;display:none;z-index:40;max-width:90vw;white-space:pre-line}
#toast.err{background:var(--bad)}
/* 편집 화면 */
#ed{position:fixed;inset:0;background:#111827;display:none;z-index:20;color:#e5e7eb}
#ed .wrap{display:flex;height:100%}
#ed .stagebox{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:10px;position:relative}
#ed .stage{position:relative;line-height:0;user-select:none}
#ed .stage img{max-width:calc(100vw - 360px);max-height:calc(100vh - 20px);display:block}
#ed .stage svg{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#ed .stage.draw svg{cursor:crosshair}
#ed .side{width:340px;flex:0 0 340px;background:#1f2937;padding:12px;overflow:auto;font-size:13px}
#ed .side .btn{background:#374151;border-color:#4b5563;color:#e5e7eb}#ed .side .btn.pri{background:var(--acc);border-color:var(--acc)}#ed .side .btn.ok{background:var(--ok);border-color:var(--ok)}#ed .side .btn.danger{background:var(--bad);border-color:var(--bad)}
#ed .side .btn.danger-o{background:transparent;border-color:#f87171;color:#fca5a5}
#ed .side .note{color:#9ca3af}
#ed .lockd{background:#78350f;color:#fde68a;border-radius:6px;padding:6px 8px;margin:6px 0}
#ed .ann{padding:6px;border-radius:8px;border:1px solid #374151;margin:5px 0;cursor:pointer}
#ed .ann.sel{border-color:#fff;background:#111827}
#ed .cls{display:flex;gap:4px;margin-top:4px}#ed .cls button{flex:1;font:inherit;font-size:12px;padding:4px 0;border-radius:6px;border:1px solid #4b5563;background:#374151;color:#e5e7eb;cursor:pointer}
#ed .cls button.on{color:#fff;font-weight:700}
#ed .row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:6px 0}
#ed kbd{display:inline-block;min-width:20px;text-align:center;padding:0 5px;border-radius:4px;background:#374151;border:1px solid #4b5563;font:12px/18px ui-monospace,Consolas,monospace}
#ed .keys td{padding:2px 6px;border:0;color:#d1d5db}#ed .keys{background:none}
#ed .badge{position:absolute;top:14px;left:14px;line-height:1.4;background:rgba(0,0,0,.6);padding:4px 10px;border-radius:6px;font-size:13px}
#ed label{cursor:pointer}
</style></head><body>
<header><div class="hrow"><h1>자세 자동 라벨</h1><span id="curw"></span></div>
<div class="hrow"><nav><button data-t="home">프로젝트</button><button data-t="input">1. 사진 넣기</button><button data-t="analyze">2. 자동 분석</button><button data-t="review">3. 검수·수정</button><button data-t="export">4. 내보내기</button><button data-t="removed">제외된 사진</button></nav>
<span id="jobmini"></span></div></header>
<main id="main"></main>
<div id="ed"></div><div id="toast"></div>
<script>
const NAMES=['lie','sit','stand'],KOR=['눕기','앉기','서기'],COL=['#ef4444','#2563eb','#16a34a'];
const col=c=>COL[c]||'#888';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let W={works:[],rule:{}},WORK=localStorage.getItem('al_work')||'',tab='home',S=null,F={cls:'',st:'',sort:'name',page:0},JOBV=null;
// SEL/SELR: 검수 목록·제외된 사진에서 고른 이름, SELA/SELRA: Shift 범위의 기준, RV/RV2: 지금 그린 목록, LASTMOVE: 방금 제외한 사진 (되돌리기용), UL: 올리기 상태
let SEL=new Set(),SELA='',SELR=new Set(),SELRA='',RP=0,RV={L:[],P:[]},RV2={R:[],P:[]},LASTMOVE=null,UL=null,IPATH='',EXO={only:true,r:['100','0','0']};
const PER=120;
const ST=[['','전체'],['need','확인 필요'],['todo','검수 안 함'],['done','검수 완료'],['empty','사람 못 찾음'],['noan','분석 안 함']];
const TL={home:'프로젝트',input:'1. 사진 넣기',analyze:'2. 자동 분석',review:'3. 검수·수정',export:'4. 내보내기',removed:'제외된 사진'};
const KT={input:'사진 가져오기',analyze:'자동 분석',export:'내보내기'},TK={'사진 가져오기':'input','자동 분석':'analyze','내보내기':'export'};
function toast(t,kind){const e=$('#toast');e.textContent=t;e.className=kind==='err'?'err':'';e.style.display='block';clearTimeout(e._t);e._t=setTimeout(()=>e.style.display='none',kind==='err'?6000:3500)}
const terr=e=>toast(e&&e.message?e.message:String(e),'err');
async function api(p,body){let r,j;
 try{r=await fetch(p,body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{})}catch(e){throw new Error('서버에 연결하지 못했어요. 서버를 켠 명령창이 열려 있는지 확인해 주세요')}
 try{j=await r.json()}catch(e){throw new Error('서버 응답을 읽지 못했어요 ('+r.status+')')}
 if(!r.ok)throw new Error(j.error||r.status);return j}
const img=(n,w)=>`/img?work=${encodeURIComponent(WORK)}&n=${encodeURIComponent(n)}&w=${w}`;
const jobBusy=()=>!!(JOBV&&JOBV.busy);
const ownJob=k=>jobBusy()&&JOBV.work===WORK&&JOBV.kind===k;
const anaLock=()=>ownJob('자동 분석');
const blockTxt=k=>jobBusy()&&!ownJob(k)?`지금 '${JOBV.kind}'이(가) 진행 중이라 끝난 뒤에 할 수 있어요.`:'';
const pend=w=>w.pending!=null?w.pending:w.images-w.analyzed;

// ---------------------------------------------------------------- 머리글
function renderHead(){const w=cur(),c={};
 if(WORK&&w.images){c.input=`<span class="cnt">${w.images}</span>`;
  c.analyze=pend(w)?`<span class="cnt" style="color:var(--warn)">남음 ${pend(w)}</span>`:'<span class="cnt" style="color:var(--ok)">끝</span>';
  c.review=`<span class="cnt">${w.reviewed}/${w.images}</span>`}
 if(WORK&&w.removed)c.removed=`<span class="cnt">${w.removed}</span>`;
 $$('nav button').forEach(b=>{const t=b.dataset.t;b.innerHTML=TL[t]+(c[t]||'');b.classList.toggle('on',t===tab);b.disabled=t!=='home'&&!WORK;b.title=b.disabled?'먼저 프로젝트를 만들거나 여세요':''});
 $('#curw').innerHTML=WORK?`현재 프로젝트: <b>${esc(WORK)}</b>`:'<span style="color:var(--mute)">프로젝트를 열어 주세요</span>';
 miniJob();setHH()}
function setHH(){document.documentElement.style.setProperty('--hh',$('header').offsetHeight+'px')}
function miniJob(){const m=$('#jobmini'),j=JOBV,p=[];let go='';
 if(UL&&!UL.done)p.push(`사진 올리는 중 ${UL.k} / ${UL.n}`);
 if(j&&j.busy){if(j.work===WORK){p.push(({'자동 분석':'자동 분석 중','사진 가져오기':'사진 가져오는 중','내보내기':'내보내는 중'}[j.kind]||j.kind+' 중')+(j.total?` ${j.done} / ${j.total}`:' …'));go=TK[j.kind]||''}
  else p.push(`다른 프로젝트(${j.work})에서 ${j.kind} 중`)}
 m.textContent=p.join(' · ');m.classList.toggle('go',!!go);m.title=go?'눌러서 진행 상황 보기':'';
 m.onclick=go?()=>{if(!E&&tab!==go)goTab(go)}:null}

// ---------------------------------------------------------------- 프로젝트
async function loadWorks(){W=await api('/api/works');if(!W.works.some(w=>w.name===WORK))WORK='';renderHead()}
async function loadState(){if(!WORK){S=null;return}const w=WORK,s=await api('/api/state?work='+encodeURIComponent(w));if(w!==WORK)return;s.by={};s.images.forEach(i=>s.by[i.n]=i);S=s}
function render(){if(!WORK)tab='home';renderHead();
 return ({home:rHome,input:rInput,analyze:rAnalyze,review:rReview,export:rExport,removed:rRemoved})[tab]()}
function goTab(t){if(t!==tab){SEL.clear();SELR.clear();LASTMOVE=null}tab=t;render()}
function nextTab(w){return !w.images?'input':pend(w)?'analyze':w.reviewed<w.images?'review':'export'}
function openWork(n){if(n!==WORK){F={cls:'',st:'',sort:'name',page:0};SEL.clear();SELR.clear();SELA=SELRA='';RP=0;LASTMOVE=null;IPATH='';EXO={only:true,r:['100','0','0']}}
 WORK=n;localStorage.setItem('al_work',n);S=null;tab=nextTab(cur());render()}
function rHome(){const L=[...W.works].sort((a,b)=>b.mtime-a.mtime);
 $('#main').innerHTML=`<div class="panel"><h2>새 프로젝트 만들기</h2>
 <p class="note">사진 묶음마다 프로젝트를 따로 만들면 서로 섞이지 않아요.</p>
 <div class="bar" style="margin:0"><input type="text" id="pnew" style="width:320px;max-width:100%" placeholder="프로젝트 이름 (예: 역사_1회차)"><button class="btn pri" id="pmk">만들고 시작하기</button></div>
 <div class="err" id="perr"></div></div>
 <div class="panel"><h2>프로젝트 열기 (${L.length})</h2>${L.length?`<table><tr><th>이름</th><th>사진</th><th>분석</th><th>검수 완료</th><th>마지막 수정</th><th></th></tr>
 ${L.map(w=>{const on=w.name===WORK;return `<tr${on?' style="background:#eef4ff"':''}><td><b>${esc(w.name)}</b>${on?' <span class="tag" style="background:#2563eb22;color:var(--acc)">지금 열림</span>':''}</td><td>${w.images}</td><td>${w.analyzed}</td><td>${w.reviewed}</td><td>${new Date(w.mtime*1000).toLocaleString()}</td><td><button class="btn sm" data-open="${esc(w.name)}">${on?'계속하기':'열기'}</button> <button class="btn sm danger-o" data-del="${esc(w.name)}">삭제</button></td></tr>`}).join('')}</table>
 <p class="note">삭제한 프로젝트는 바로 지워지지 않고 <b>trash</b> 폴더로 옮겨져요. 되살리려면 그 폴더를 work 폴더로 다시 옮기면 돼요.</p>`:`<p class="note">아직 프로젝트가 없어요. 위에서 이름을 적고 '만들고 시작하기'를 누르세요.</p>`}</div>`;
 const chk=()=>{const n=$('#pnew').value.trim();let m='';
  if(/[\\\/:*?"<>|]/.test(n))m='이름에 \\ / : * ? " < > | 는 쓸 수 없어요';
  else if(/\.$/.test(n))m='프로젝트 이름은 점(.)으로 끝날 수 없어요';
  else if(/^(CON|PRN|AUX|NUL|COM[1-9]|LPT[1-9])(\..*)?$/i.test(n))m='CON, PRN, AUX, NUL, COM1~9, LPT1~9 는 Windows 가 쓰는 이름이라 프로젝트 이름으로 쓸 수 없어요';
  else if(n.length>60)m='프로젝트 이름은 60자까지 쓸 수 있어요';
  else if(n&&W.works.some(w=>w.name.toLowerCase()===n.toLowerCase()))m='같은 이름의 프로젝트가 이미 있어요';
  $('#perr').textContent=m;$('#pmk').disabled=!!m;return m};
 const mk=async()=>{if(chk())return;const n=$('#pnew').value.trim();if(!n){$('#perr').textContent='프로젝트 이름을 적어 주세요';return}
  $('#pmk').disabled=true;try{await api('/api/new',{name:n});await loadWorks()}catch(e){$('#pmk').disabled=false;$('#perr').textContent=e.message;return terr(e)}openWork(n)};
 $('#pnew').oninput=chk;$('#pmk').onclick=mk;$('#pnew').onkeydown=e=>{if(e.key==='Enter')mk()};
 $$('[data-open]').forEach(b=>b.onclick=()=>openWork(b.dataset.open));
 $$('[data-del]').forEach(b=>b.onclick=async()=>{const n=b.dataset.del,w=W.works.find(x=>x.name===n)||{};
  const t=prompt(`'${n}' 프로젝트를 삭제할까요? (사진 ${w.images}장, 검수 완료 ${w.reviewed}장)\n목록에서 사라지고 trash 폴더로 옮겨져요.\n확인하려면 프로젝트 이름을 똑같이 적으세요.`);
  if(t===null)return;if(t.trim()!==n)return toast('이름이 달라서 삭제하지 않았어요','err');
  try{await api('/api/delete_work',{name:n})}catch(e){return terr(e)}
  if(WORK===n){WORK='';localStorage.removeItem('al_work');S=null;SEL.clear();SELR.clear();LASTMOVE=null}toast(`'${n}' 삭제 (trash 로 옮김)`);await loadWorks().catch(terr);render()})}
$$('nav button').forEach(b=>b.onclick=()=>goTab(b.dataset.t));
$('#main').addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(b&&!b.disabled)goTab(b.dataset.go)});
const cur=()=>W.works.find(w=>w.name===WORK)||{images:0,analyzed:0,reviewed:0,pending:0,removed:0,labeled:0,reviewed_labeled:0};

// ---------------------------------------------------------------- 진행 상황 (작업은 서버에서 한 번에 하나)
async function pollJob(){if(pollJob.busy){pollJob.again=1;return}pollJob.busy=1;clearTimeout(pollJob.t);
 try{const j=await api('/api/job'),p=JOBV,sig=x=>x&&x.busy?x.kind+'|'+x.work:'';JOBV=j;
  if(!j.busy&&((p&&p.busy)||(pollJob.want&&j.seq>=pollJob.want))){pollJob.want=0;await jobDone(j)}
  else if(sig(p)!==sig(j))refresh();
  else{miniJob();const b=$('#jobbox');if(b&&KT[tab])b.innerHTML=jobHtml(KT[tab]);const lb=$('#lockbar');if(lb&&anaLock())lb.textContent=lockTxt()}
 }catch(e){console.error(e)}
 finally{pollJob.busy=0;pollJob.t=setTimeout(pollJob,pollJob.again?0:jobBusy()?600:4000);pollJob.again=0}}
async function jobDone(j){const r=j.result||{};
 if(j.err)toast(`${j.kind} 실패: ${j.err}`,'err');
 else if(j.kind==='사진 가져오기')toast(`사진 가져오기 끝: 새로 ${r.copied}장 · 건너뜀 ${(r.skipped||0)+(r.skipped_removed||0)+(r.skipped_stem||0)+(r.skipped_broken||0)}장${r.labels?` · 라벨 ${r.labels}장 (자동 분석 없이 바로 검수할 수 있어요)`:''}`);
 else if(j.kind==='자동 분석')toast(`자동 분석 끝: ${r.analyzed}장 · ${r.sec}초${r.failed?` · 분석 못 한 사진 ${r.failed}장 (열 수 없는 사진일 수 있어요)`:''}`,r.failed?'err':'');
 else if(j.kind==='내보내기'){const m=r.images||{};toast(`내보내기 끝: 사진 ${(m.train||0)+(m.valid||0)+(m.test||0)}장`)}
 try{await loadWorks()}catch(e){}

function pDown(e){if(e.button!==0)return;const p=pt(e),t=e.target;e.currentTarget.setPointerCapture(e.pointerId);
 if(!E.draw&&t.dataset.h){E.drag={type:'resize',h:t.dataset.h,orig:[...E.anns[E.sel].box],start:p,before:clone(E.anns)}}
 else if(!E.draw&&t.dataset.k!==undefined){E.sel=+t.dataset.k;E.drag={type:'move',orig:[...E.anns[E.sel].box],start:p,before:clone(E.anns)};drawSvg()}
 else{E.drag={type:'draw',start:p,cur:null}}}
function pMove(e){if(!E||!E.drag)return;const p=pt(e),d=E.drag,i=E.list[E.k];
 if(d.type==='draw'){d.cur=p;drawSvg();return}
 const dx=p[0]-d.start[0],dy=p[1]-d.start[1];let[x1,y1,x2,y2]=d.orig;
 if(d.type==='move'){const mx=Math.max(-x1,Math.min(i.w-x2,dx)),my=Math.max(-y1,Math.min(i.h-y2,dy));E.anns[E.sel].box=[x1+mx,y1+my,x2+mx,y2+my]}
 else{if(d.h.includes('w'))x1+=dx;if(d.h.includes('e'))x2+=dx;if(d.h.includes('n'))y1+=dy;if(d.h.includes('s'))y2+=dy;E.anns[E.sel].box=norm([x1,y1],[x2,y2])}
 d.moved=true;delete E.anns[E.sel].auto;drawSvg()}
function pUp(e){if(!E||!E.drag)return;const d=E.drag;E.drag=null;const sc=scale();
 if(d.type==='draw'){if(d.cur&&Math.abs(d.cur[0]-d.start[0])>6*sc&&Math.abs(d.cur[1]-d.start[1])>6*sc){snap();E.anns.push({c:E.newCls,box:norm(d.start,d.cur)});E.sel=E.anns.length-1;E.draw=false}else if(!E.draw){E.sel=-1}drawEd();return}
 if(d.moved){E.hist.push(d.before);E.fut=[];E.dirty=true}drawEd()}
function setCls(c){if(E.sel>=0&&E.anns[E.sel]){if(E.anns[E.sel].c!==c){snap();E.anns[E.sel].c=c}setNewCls(c,true)}else setNewCls(c)}
function setNewCls(c,quiet){E.newCls=c;localStorage.setItem('al_cls',c);drawEd()}
function delSel(){if(E.sel<0||!E.anns[E.sel])return;snap();E.anns.splice(E.sel,1);E.sel=Math.min(E.sel,E.anns.length-1);drawEd()}
function nudge(dx,dy,resize){if(E.sel<0||!E.anns[E.sel])return;const i=E.list[E.k];let[x1,y1,x2,y2]=E.anns[E.sel].box;
 if(!(nudge.t&&Date.now()-nudge.t<800&&nudge.k===E.sel))snap();nudge.t=Date.now();nudge.k=E.sel;E.dirty=true;  // 연속 누름은 되돌리기 한 번으로
 if(resize){x2=Math.max(x1+2,Math.min(i.w,x2+dx));y2=Math.max(y1+2,Math.min(i.h,y2+dy))}else{const mx=Math.max(-x1,Math.min(i.w-x2,dx)),my=Math.max(-y1,Math.min(i.h-y2,dy));x1+=mx;x2+=mx;y1+=my;y2+=my}
 E.anns[E.sel].box=[x1,y1,x2,y2];delete E.anns[E.sel].auto;drawSvg();const sv=$('#sv');if(sv)sv.disabled=false}
async function save(reviewed){const i=E.list[E.k];const body={work:WORK,n:i.n,w:i.w,h:i.h,anns:E.anns.map(a=>({c:a.c,box:a.box}))};if(reviewed!==undefined)body.reviewed=reviewed;
 const r=await api('/api/save',body);Object.assign(i,r.state);if(S&&S.by[i.n])Object.assign(S.by[i.n],r.state);E.dirty=false;return r}
async function step(d){const k=E.k+d;if(k<0||k>=E.list.length){toast(d>0?'마지막 사진이에요':'첫 사진이에요');return}

  let r;try{r=await api('/api/move',{work:WORK,names:[i.n],to:'removed'})}catch(e){return terr(e)}

 E.dirty=false;toast('분석 중…');pollJob.want=r0.seq||0;pollJob(); // 고치던 내용은 저장하지 않고 버림 (곧 자동 결과로 바뀜)

 let st;try{st=await api('/api/state?work='+encodeURIComponent(WORK))}catch(e){return terr(e)}
 const ni=st.images.find(v=>v.n===i.n);if(!E||!ni)return;const x=E.list.findIndex(v=>v.n===i.n);if(x<0)return;
 E.list[x]=ni;if(S&&S.by[i.n])Object.assign(S.by[i.n],ni);if(x===E.k)loadEd()}
// 검수 목록에서 Esc = 선택 해제 (편집 화면이 닫혀 있고 입력칸에 초점이 없을 때)
document.addEventListener('keydown',e=>{if(E||e.defaultPrevented||e.key!=='Escape'||tab!=='review'||!SEL.size)return;if(e.target.matches('input,select,textarea'))return;SEL.clear();updSel()});
document.addEventListener('keydown',e=>{if(!E)return;if(e.target.matches('input[type=text],input[type=number],select'))return;const k=e.key,ctrl=e.ctrlKey||e.metaKey;
 const go=f=>{e.preventDefault();f()};
 if(ctrl&&(k==='z'||k==='Z')&&!e.shiftKey)return go(undo);if(ctrl&&(k==='y'||k==='Y'||((k==='z'||k==='Z')&&e.shiftKey)))return go(redo);
 if(ctrl&&(k==='s'||k==='S'))return go(()=>save().then(()=>{toast('저장했어요');drawEd()}).catch(x=>toast('저장 실패: '+x.message,'err')));
 if(ctrl)return;
 if(e.shiftKey&&k.startsWith('Arrow')){const st=e.altKey?2:2*Math.max(1,Math.round(scale()));const v={ArrowLeft:[-st,0],ArrowRight:[st,0],ArrowUp:[0,-st],ArrowDown:[0,st]}[k];return go(()=>nudge(v[0],v[1],e.altKey))}
 if(k==='ArrowRight'||k==='d'||k==='D')return go(()=>step(1));if(k==='ArrowLeft'||k==='a'||k==='A')return go(()=>step(-1));
 if(k==='Enter')return go(markDone);
 if(['0','1','2'].includes(k))return go(()=>setCls(+k));
 if(k==='Tab')return go(()=>{const n=E.anns.length;if(!n)return;E.sel=e.shiftKey?(E.sel<=0?n-1:E.sel-1):(E.sel+1)%n;drawEd()});
 if(k==='n'||k==='N')return go(()=>{E.draw=!E.draw;drawEd()});

 if(k==='k'||k==='K')return go(()=>{E.kp=!E.kp;localStorage.setItem('al_kp',E.kp?1:0);drawEd()});
 if(k==='h'||k==='H')return go(()=>{E.hide=!E.hide;drawEd()});
 if(k==='x'||k==='X')return go(removeCur);
 if(k==='?')return go(()=>{E.help=!E.help;localStorage.setItem('al_help',E.help?1:0);drawEd()});
 if(k==='Escape')return go(()=>{if(E.drag){E.drag=null;drawSvg()}else if(E.draw){E.draw=false;drawEd()}else if(E.sel>=0){E.sel=-1;drawEd()}else closeEd()})});

function rExport(){const w=cur();
